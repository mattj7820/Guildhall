name: Stress

# Run by hand to hunt flaky end-to-end tests on CI instead of a laptop: one spec (or a few),
# repeated many times in parallel, with no retries, so a flake fails the run and keeps its trace.
on:
  workflow_dispatch:
    inputs:
      specs:
        description: Spec files or filters, e.g. tests/e2e/inventory.spec.ts
        required: true
      repeat:
        description: Times to run each test
        default: "20"
      grep:
        description: Only tests whose title matches (optional)
        default: ""
      workers:
        description: Workers; 1 for fight.spec, whose copies would share the table's one fight
        default: ""

permissions:
  contents: read

jobs:
  stress:
    name: Stress ${{ inputs.specs }} ×${{ inputs.repeat }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the specs again and again
        env:
          SPECS: ${{ inputs.specs }}
          REPEAT: ${{ inputs.repeat }}
          GREP: ${{ inputs.grep }}
          WORKERS: ${{ inputs.workers }}
        run: |
          # Word-split SPECS on purpose: several files may be given.
          # shellcheck disable=SC2086
          npx playwright test $SPECS --repeat-each "$REPEAT" --retries 0 ${GREP:+--grep "$GREP"} ${WORKERS:+--workers "$WORKERS"}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
